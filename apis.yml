aid: intego
name: Intego
description: >-
  Intego is a consumer cybersecurity company with more than 25 years of Mac and
  Windows protection, headquartered in France (Intego S.A.). Its flagship Intego
  ONE suite bundles antivirus with real-time threat detection, a network
  firewall, the SmartClean disk-cleanup and performance optimizer, and Intego
  VPN for encrypted private browsing, sold as separate macOS and Windows product
  lines. Intego also runs The Mac Security Blog, a long-running source of Apple
  and macOS security reporting. The company publishes a Compliance Hub for
  procurement and vendor-security reviews and holds an active ISO/IEC 27001:2022
  information-security certification. Intego is a consumer software vendor and
  does not currently publish a public developer API, SDK, or developer portal;
  this profile was surfaced as a Bessemer Venture Partners portfolio lead and
  enriched with its public identity, security, and compliance surface.
